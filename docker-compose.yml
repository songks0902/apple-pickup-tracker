services:
  web:
    build: .
    image: apple-tracker:latest
    env_file: .env
    environment:
      PORT: "8080"
      CACHE_DIR: /app/data
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
